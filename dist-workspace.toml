[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app.
# No MSI on purpose: the release ships a .zip for Windows plus the PowerShell
# installer, which already covers the one-command Windows install.
installers = ["shell", "powershell", "npm", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Build every target's archives and installers on pull requests too (uploaded
# as workflow artifacts, nothing is released): each target has its own GPU
# toolchain (see .github/scripts/release-gpu-backend.sh), so a PR must prove
# they all build before a tag is pushed.
pr-run-mode = "upload"
# Whether to install an updater program
install-updater = false
# The hand-edited jobs (preflight, gates) are kept on regeneration: dist refuses
# to regenerate the CI file, so a later `dist generate` cannot clobber them.
allow-dirty = ["ci"]
# Publish the Homebrew formula to our custom tap on every stable release
tap = "raultov/homebrew-tap"
# Publish the npm installer package to the @raultov scope on every stable
# release. Scoped on purpose: the unscoped name can be squatted by a third
# party, which already happened to browser-control-mcp.
npm-scope = "@raultov"
publish-jobs = ["homebrew", "npm"]
# Only stable releases are published to npm and Homebrew
publish-prereleases = false
# Pin the actions dist uses by commit SHA
github-action-commits = { "actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1", "actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333", "actions/setup-node" = "249970729cb0ef3589644e2896645e5dc5ba9c38", "actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" }
