[package]
name = "media-transcriber-mcp"
version = "0.8.0"
edition = "2024"
authors = ["raultov <raultov@protonmail.com>"]
description = "MCP server for transcribing local video and audio files using Whisper"
license = "MIT"
homepage = "https://github.com/raultov/media-transcriber-mcp"
repository = "https://github.com/raultov/media-transcriber-mcp"
readme = "README.md"
keywords = ["mcp", "whisper", "transcription", "audio", "video"]
categories = ["multimedia::audio", "multimedia::video"]

[lints.rust]
# Enforces the no-unsafe policy stated in AGENTS.md. `deny` rather than
# `forbid`; `deny` still blocks new unsafe while allowing documented,
# audited exceptions via `#[expect(unsafe_code, reason = "...")]`.
unsafe_code = "deny"

[lints.clippy]
# Readability gates. Thresholds live in clippy.toml; these lints are
# allow-by-default (pedantic/nursery), so they are inert without this.
too_many_lines = "warn"
cognitive_complexity = "warn"

# Ban bare `#[allow]` in favour of `#[expect(..., reason = "...")]`, which
# warns once the suppression is no longer needed. This keeps the refactor
# backlog self-cleaning instead of accumulating stale opt-outs.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[dependencies]
rust-mcp-sdk = { version = "0.8.3", features = ["server", "macros"] }
tokio = { version = "1.37.0", features = ["full"] }
whisper-rs = "0.16"
anyhow = "1.0.86"
serde_json = "1.0.117"
serde = { version = "1.0", features = ["derive"] }
async-trait = "0.1"
hound = "3.5.1"
tempfile = "3.10.1"
clap = { version = "4.6.0", features = ["derive", "env"] }
base64 = "0.22.1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
